<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban - Дошка справ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Kanban-дошка справ</h1>
    </header>

    <main>
        <section id="ToDo">
            <h2>To Do</h2>
            <article class="card">
                <h3>Картка завдання: Лягти спати вчасно</h3>
                <label for="card-input-id-1">Коментар до картки:</label>
                    <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-1"></textarea>
            </article>
        </section>

        <section id="InProgress">
            <h2>In Progress</h2>
            <article class="card">
                <h3>Картка завдання: КП№3</h3>
                    <label for="card-input-id-2">Коментар до картки:</label>
                    <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-2"></textarea>
            </article>
        </section>

        <section id="Done">
            <h2>Done</h2>
        </section>
    </main>

    <footer>
        <p>Створено студентом факультету ФІОТ КПІ групи ІП-51 Малявським К.В. 2026</p>
    </footer>
<script src="js/app.js"></script>
</body>
</html>
