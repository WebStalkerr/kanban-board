<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban - Дошка справ</title>
<link rel="stylesheet" href="css/style.css">
<script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Kanban-дошка справ</h1>
    </header>

    <form id="task-form" class="task-form">
        <div class="form-field">
            <label for="task-title">Назва задачі:</label>
            <input type="text" id="task-title" name="title"
                required pattern=".{3,}" title="Мінімум 3 символи"
                placeholder="Наприклад: Купити хліб">
        </div>

        <div class="form-field">
            <label for="task-column">Колонка:</label>
            <select id="task-column" name="column">
                <option value="todo">To Do</option>
                <option value="inprogress">In Progress</option>
                <option value="done">Done</option>
            </select>
        </div>

        <button type="submit">Додати задачу</button>
    </form>

    <div class="status-bar">
        <button type="button" id="refresh-btn" class="btn">Оновити</button>
        <p id="loading" class="status status-loading" hidden>Завантаження...</p>
        <p id="error" class="status status-error" role="alert" hidden></p>
    </div>

    <main>
        <section id="ToDo">
            <h2>To Do</h2>
            <div class="task-list" id="todo-list">
                <article class="card">
                    <h3>Лягти спати вчасно</h3>
                    <label for="card-input-id-1">Коментар до картки:</label>
                    <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-1"></textarea>
                    </article>
            </div>
        </section>

        <section id="InProgress">
            <h2>In Progress</h2>
            <div class="task-list" id="inprogress-list">
                <article class="card">
                    <h3>КП№7</h3>
                        <label for="card-input-id-2">Коментар до картки:</label>
                        <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-2"></textarea>
                </article>
            </div>
        </section>

        <section id="Done">
            <h2>Done</h2>
            <p id="done-count">Виконано: 0</p>
            <div class="task-list" id="done-list">
                <article class="card">
                    <h3>Повечеряти</h3>
                        <label for="card-input-id-2">Коментар до картки:</label>
                        <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-2"></textarea>
                </article>
                <article class="card">
                    <h3>Прибрати кімнату</h3>
                        <label for="card-input-id-2">Коментар до картки:</label>
                        <textarea name="card-comment" placeholder="Коментар до картки завдання..." id="card-input-id-2"></textarea>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Створено студентом факультету ФІОТ КПІ групи ІП-51 Малявським К.В. 2026</p>
    </footer>
</body>
</html>
